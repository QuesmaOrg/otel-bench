name: Check benchmark canaries

on:
  pull_request:
    paths:
      - "datasets/otel/**"
      - "ci_checks/check-canary.py"
      - ".github/workflows/check-canaries.yml"
  push:
    branches:
      - main
    paths:
      - "datasets/otel/**"
      - "ci_checks/check-canary.py"
      - ".github/workflows/check-canaries.yml"

permissions:
  contents: read

jobs:
  check-canaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify benchmark canaries
        run: python3 ci_checks/check-canary.py
