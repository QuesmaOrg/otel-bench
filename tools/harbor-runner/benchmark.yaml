# Harbor Benchmark Runner Configuration
#
# This configuration file allows you to customize which tasks and models
# to benchmark, and how to run them.

# Dataset and output settings
dataset_path: datasets/opentelemetry
jobs_dir: jobs
output_dir: benchmark-results

# Execution settings
agent: terminus-2
parallel: 12 # Harbor's internal concurrency (-n flag)
attempts: 1 # Number of attempts per task/model combination (-k flag)
force_build: false # Force rebuild docker images

# Task patterns to match (glob patterns)
# Use "*" to match all tasks, or specific patterns like "go-otel-*"
task_patterns:
  # C++ tasks
  - "cpp-otel-advanced"
  - "cpp-otel-distributed-context-propagation"
  - "cpp-otel-simple"
  # Erlang tasks
  - "erlang-otel-microservices"
  # Go tasks
  - "go-otel-distributed-context-propagation"
  - "go-otel-grpc-fix"
  - "go-otel-http-tracing"
  - "go-otel-log"
  - "go-otel-microservices"
  - "go-otel-microservices-logs"
  - "go-otel-microservices-traces"
  - "go-otel-microservices-traces-simple"
  - "go-otel-workflow-tracing"
  # Java tasks
  - "java-otel-advanced"
  - "java-otel-distributed-context-propagation"
  - "java-otel-microservices"
  - "java-otel-simple"
  # JavaScript tasks
  - "js-otel-microservices"
  # .NET tasks
  - "net-otel-microservices"
  # PHP tasks
  - "php-otel-distributed-context-propagation"
  - "php-otel-microservices"
  # Python tasks
  - "python-otel-distributed-context-propagation"
  - "python-otel-microservices"
  # Ruby tasks
  - "ruby-otel-microservices"
  # Rust tasks
  - "rust-otel-distributed-context-propagation"
  - "rust-otel-microservices"
  # Swift tasks
  - "swift-otel-microservices"

# Models to benchmark (from simple/cheap to sophisticated/expensive)
# Order matters for dashboard display
# All models use OPENROUTER_API_KEY
models:
  # --- Google models ---
  - name: openrouter/google/gemini-3-pro-preview
    display_name: Gemini 3 Pro
    provider: openrouter

  - name: openrouter/google/gemini-3-flash-preview
    display_name: Gemini 3 Flash
    provider: openrouter

  # --- OpenAI GPT-5 models ---
  - name: openrouter/openai/gpt-5.2
    display_name: GPT-5.2
    provider: openrouter

  - name: openrouter/openai/gpt-5.1
    display_name: GPT-5.1
    provider: openrouter

  - name: openrouter/openai/gpt-5.1-codex-max
    display_name: GPT-5.1-Codex-Max
    provider: openrouter
    
  # --- xAI Grok models ---
  - name: openrouter/x-ai/grok-4
    display_name: Grok 4
    provider: openrouter

  - name: openrouter/x-ai/grok-4.1-fast
    display_name: Grok 4.1 Fast
    provider: openrouter

  # --- Claude 4.5 models ---
  - name: openrouter/anthropic/claude-haiku-4.5
    display_name: Claude Haiku 4.5
    provider: openrouter

  - name: openrouter/anthropic/claude-sonnet-4.5
    display_name: Claude Sonnet 4.5
    provider: openrouter

  - name: openrouter/anthropic/claude-opus-4.5
    display_name: Claude Opus 4.5
    provider: openrouter

  # --- Open source models ---
  - name: openrouter/deepseek/deepseek-v3.2
    display_name: DeepSeek V3.2
    provider: openrouter

  - name: openrouter/moonshotai/kimi-k2-thinking
    display_name: Kimi K2 Thinking
    provider: openrouter
  
  - name: openrouter/z-ai/glm-4.7
    display_name: GLM 4.7
    provider: openrouter