# OpenTelemetry Benchmark Task Data
# Contains structured data for all 24 benchmark tasks
# See TASK_SUMMARY.md for the full human-readable documentation

tasks:
  cpp-simple:
    pass_rate: 74.4
    category: "C++ Tracing"
    difficulty: "Easy"
    description: |
      Instrument a simple C++ application with 3 methods (`work`, `fastOp`, `slowOp`)
      to generate OpenTelemetry-compatible trace output. Create OTEL implementation
      that outputs JSON traces with parent-child span relationships.
    success_factors: |
      - Simple, well-defined scope (3 spans only)
      - No external dependencies or network calls
      - Clear output format requirements
    failure_reasons: |
      - Missing parent-child relationships
    example_error: ""

  cpp-advanced:
    pass_rate: 33.3
    category: "C++ Advanced"
    difficulty: "Hard"
    description: |
      Instrument a complex multi-threaded C++ application simulating a web service
      with database operations, message queue, and background workers. Requires
      comprehensive tracing including error handling, async operations, and context
      propagation across threads.
    success_factors: ""
    failure_reasons: |
      - Multi-threaded context propagation
      - Error handling and exception recording
      - Multiple service components (DB, MQ, workers)
      - Requires 15-20 spans with correct relationships
      - Async span linking
      - Context lost across thread boundaries
      - Missing error event recording
      - Incomplete span relationships
    example_error: ""

  cpp-distributed-context-propagation:
    pass_rate: 2.6
    category: "C++ Context"
    difficulty: "Hard"
    description: |
      Instrument a C++ client-server application using httplib. Client makes search
      requests, receives tokens, retrieves results. Must demonstrate distributed
      tracing with context propagation between client and server, producing exactly
      2 trace IDs.
    success_factors: ""
    failure_reasons: |
      - C++ OTEL SDK is complex to configure
      - Context propagation via HTTP headers is tricky
      - Test expects exactly 2 trace IDs (strict)
      - CMake build configuration challenges
    example_error: ""

  erlang-microservices:
    pass_rate: 0
    category: "Erlang Full"
    difficulty: "Very Hard"
    description: |
      Add OTEL tracing and logging to Erlang microservices (gateway, order, stock).
      Export telemetry to OTLP endpoint, log lifecycle events and HTTP requests.
    success_factors: ""
    failure_reasons: |
      Models hallucinate non-existent Erlang packages. The Erlang OTEL ecosystem
      is poorly documented, leading to packages like `opentelemetry 1.4.2` that
      don't exist in Hex.
    example_error: "===> Package not found in any repo: opentelemetry 1.4.2"

  go-distributed-context-propagation:
    pass_rate: 2.6
    category: "Go Context"
    difficulty: "Hard"
    description: |
      Instrument a Go client-server application with OTEL tracing. Client makes
      HTTP requests, must propagate trace context to server. Test expects exactly
      2 unique trace IDs.
    success_factors: ""
    failure_reasons: |
      - Strict assertion: exactly 2 trace IDs required
      - Models often produce 1 (too much propagation) or 3+ (not enough)
      - Requires understanding of when to create new vs. continue traces
    example_error: ""

  go-grpc-fix:
    pass_rate: 46.2
    category: "Go Bug Fix"
    difficulty: "Medium"
    description: |
      Debug and fix a failing gRPC end-to-end test in the OpenTelemetry Go
      compile-time instrumentation project. The instrumentation code isn't being
      properly injected during compilation.
    success_factors: |
      - Clear problem definition (fix failing test)
      - Existing codebase with working examples to compare
      - Test output provides debugging clues
    failure_reasons: |
      - Incorrect hook configuration
      - Missing gRPC-specific instrumentation points
      - Code generation errors
    example_error: ""

  go-log:
    pass_rate: 0
    category: "Go Logging"
    difficulty: "N/A (Broken)"
    description: |
      Add OTEL logging to Go application. Task environment is broken and needs
      fixing.
    success_factors: ""
    failure_reasons: |
      Task/environment is broken and needs fixing.
    example_error: ""

  go-microservices:
    pass_rate: 10.3
    category: "Go Full"
    difficulty: "Hard"
    description: |
      Add both OTEL tracing AND logging to Go microservices (gateway, order, stock).
      Must use OTEL SDK v1.39.0, export to OTLP endpoint, log lifecycle and HTTP
      events, work without collector.
    success_factors: ""
    failure_reasons: |
      - Dual requirement (tracing + logging)
      - Specific SDK version required
      - Multiple services to instrument
      - Graceful degradation when collector unavailable
    example_error: ""

  go-microservices-logs:
    pass_rate: 25.6
    category: "Go Logging"
    difficulty: "Medium"
    description: |
      Add OTEL logging only to Go microservices. Log lifecycle events, HTTP
      requests, and ensure graceful degradation without collector.
    success_factors: |
      - Single focus (logging only, no tracing)
      - Simpler than dual instrumentation
      - Go logging APIs are well-documented
    failure_reasons: ""
    example_error: ""

  go-microservices-traces:
    pass_rate: 51.3
    category: "Go Tracing"
    difficulty: "Medium"
    description: |
      Add OTEL tracing only to Go microservices. Follow conventions and use
      recent OTEL SDK.
    success_factors: |
      - Single focus (tracing only, no logging)
      - Go OTEL tracing is well-documented
      - Fewer requirements than full instrumentation
    failure_reasons: ""
    example_error: ""

  go-microservices-traces-simple:
    pass_rate: 0
    category: "Go Tracing"
    difficulty: "N/A (Broken)"
    description: |
      Simplified version of Go microservices tracing. Task environment is broken
      and needs fixing.
    success_factors: ""
    failure_reasons: |
      Task/environment is broken and needs fixing.
    example_error: ""

  go-workflow-tracing:
    pass_rate: 0
    category: "Go Tracing"
    difficulty: "Hard"
    description: |
      Instrument a Go client-server search workflow with focused OTEL tracing.
      Must trace only essential HTTP operations (client workflow, requests, server
      handlers) with at most 6 spans.
    success_factors: ""
    failure_reasons: |
      Models over-instrument, creating 11+ spans by adding spans for internal
      operations (`process_query`, `lookup_token`, etc.). The task explicitly
      requires minimal, focused instrumentation.
    example_error: "AssertionError: Too many spans: 11 (expected at most 6)"

  java-distributed-context-propagation:
    pass_rate: 0
    category: "Java Context"
    difficulty: "Hard"
    description: |
      Instrument a Java client-server application with minimal OTEL tracing.
      Client makes two workflows (valid token, invalid token). Must produce
      exactly 2 trace IDs.
    success_factors: ""
    failure_reasons: |
      - Test expects exactly 2 trace IDs, models produce 3
      - Java OTEL SDK complexity
      - Models create extra traces for initialization/startup
    example_error: ""

  java-microservices:
    pass_rate: 0
    category: "Java Full"
    difficulty: "Very Hard"
    description: |
      Add OTEL tracing and logging to Java Spring Boot microservices (gateway,
      order, stock). Must use OTEL SDK v1.39.0, preserve Makefiles.
    success_factors: ""
    failure_reasons: |
      Models use incorrect Java OTEL SDK APIs:
      - Non-existent packages (`opentelemetry-exporter-otlp-http-logs`)
      - Wrong package paths (`io.opentelemetry.semconv.ResourceAttributes`)
      - Wrong method signatures (`BatchSpanProcessor.create()`)
      - Import conflicts (`Logger` ambiguous)
      - Non-existent Spring classes (`ApplicationStoppingEvent`)
    example_error: ""

  js-microservices:
    pass_rate: 17.9
    category: "JavaScript Full"
    difficulty: "Medium"
    description: |
      Add OTEL tracing and logging to Node.js/JavaScript microservices. Use OTEL
      SDK v1.39.0, export to OTLP, log lifecycle and HTTP events.
    success_factors: |
      - JavaScript OTEL SDK is well-documented
      - npm ecosystem is familiar to models
      - Auto-instrumentation available
    failure_reasons: |
      - Version mismatches
      - Missing lifecycle logging
      - Async context propagation issues
    example_error: ""

  net-microservices:
    pass_rate: 10.3
    category: ".NET Full"
    difficulty: "Hard"
    description: |
      Add OTEL tracing and logging to .NET microservices (gateway, order, stock).
      Export to OTLP, log lifecycle and HTTP events, work without collector.
    success_factors: ""
    failure_reasons: |
      - .NET OTEL SDK has specific patterns
      - Multiple project files to configure
      - NuGet package management
      - Dual instrumentation requirement
      - Wrong package versions
      - Missing lifecycle logging
      - Services don't respond to requests
    example_error: ""

  php-distributed-context-propagation:
    pass_rate: 10.3
    category: "PHP Context"
    difficulty: "Hard"
    description: |
      Instrument a PHP client-server application with OTEL tracing. Demonstrate
      distributed context propagation, produce exactly 2 trace IDs.
    success_factors: |
      - PHP OTEL SDK is relatively straightforward
      - Composer dependency management works well
      - HTTP context propagation is simpler in PHP
    failure_reasons: |
      - Server output format mismatch (test expects "Server starting on :8080"
        but PHP dev server outputs different format)
      - Only 1 trace ID produced instead of 2 (context propagated across both
        workflows)
    example_error: "AssertionError: Expected at least 2 trace IDs, got 1"

  php-microservices:
    pass_rate: 2.6
    category: "PHP Full"
    difficulty: "Hard"
    description: |
      Add OTEL tracing and logging to PHP Sinatra-style microservices. Export to
      OTLP, log lifecycle and HTTP events.
    success_factors: ""
    failure_reasons: |
      - PHP long-running process patterns differ
      - Dual instrumentation complexity
      - Less common use case for models
    example_error: ""

  python-distributed-context-propagation:
    pass_rate: 0
    category: "Python Context"
    difficulty: "Hard"
    description: |
      Instrument a Python client-server application with OTEL tracing. Must
      produce exactly 2 trace IDs for two separate workflows.
    success_factors: ""
    failure_reasons: |
      Test expects 2 trace IDs but models produce only 1. Models propagate
      context "too well" - they continue the same trace across both workflows
      instead of creating separate traces for each.
    example_error: "AssertionError: Expected more than 1 trace ID, got 1"

  python-microservices:
    pass_rate: 33.3
    category: "Python Full"
    difficulty: "Medium"
    description: |
      Add OTEL tracing and logging to Python microservices. Export to OTLP, log
      lifecycle and HTTP events, preserve Makefile targets.
    success_factors: |
      - Python OTEL SDK is well-documented
      - pip/requirements.txt is familiar
      - Good auto-instrumentation support
    failure_reasons: |
      - Missing lifecycle logging
      - Makefile targets broken
      - Async context issues
    example_error: ""

  ruby-microservices:
    pass_rate: 0
    category: "Ruby Full"
    difficulty: "Very Hard"
    description: |
      Add OTEL tracing and logging to Ruby Sinatra microservices (gateway, order,
      stock). Export to OTLP, log lifecycle and HTTP events.
    success_factors: ""
    failure_reasons: |
      Code compiles and dependencies install, but no telemetry is exported.
      Common issues:
      - Wrong OTLP endpoint configuration
      - Exporter not initialized properly
      - Missing shutdown/flush calls
    example_error: |
      All code compiled successfully
      Found 0 rows in traces table

  rust-distributed-context-propagation:
    pass_rate: 2.6
    category: "Rust Context"
    difficulty: "Hard"
    description: |
      Instrument a Rust client-server application with OTEL tracing. Demonstrate
      context propagation, produce exactly 2 trace IDs.
    success_factors: ""
    failure_reasons: |
      - Rust OTEL SDK is complex
      - Strict assertion on trace ID count
      - Cargo dependency management challenges
    example_error: ""

  rust-microservices:
    pass_rate: 0
    category: "Rust Full"
    difficulty: "N/A (Env Issue)"
    description: |
      Add OTEL tracing and logging to Rust microservices (gateway, order, stock).
      Export to OTLP, log lifecycle and HTTP events.
    success_factors: ""
    failure_reasons: |
      Docker environment missing system dependencies. The `openssl-sys` crate
      requires `pkg-config` and `libssl-dev`, which aren't installed.
      Root cause: Environment configuration issue, not model failure.
    example_error: |
      Could not find openssl via pkg-config
      The pkg-config command could not be found.

  swift-microservices:
    pass_rate: 0
    category: "Swift Full"
    difficulty: "Very Hard"
    description: |
      Add OTEL tracing and logging to Swift microservices (gateway, order, stock).
      Export to OTLP, log lifecycle and HTTP events.
    success_factors: ""
    failure_reasons: |
      Swift services fail to compile or start. No `test_compile_all` test exists,
      so specific errors aren't captured. Swift OTEL SDK is immature and Swift
      Package Manager is complex.
    example_error: ""
